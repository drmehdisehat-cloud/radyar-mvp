# Stage-0 CI: experimental branch only; no deploy or repository secrets.
name: Dadyar stage-0 experimental CI
on:
  push:
    branches:
      - dadyar/mvp-sync-028
permissions:
  contents: read
jobs:
  verify-existing-frontend:
    if: github.ref == 'refs/heads/dadyar/mvp-sync-028'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check existing source syntax
        run: |
          node --check app.js
          node --check flows.js
          node --check export.js
          node --check api-validation.js
          node --check backend/validation.js
          node --check backend/rate-limit.js
          node --check backend/server.js
          node --check tests/real-browser-smoke.cjs
      - name: Run every committed contract test
        run: node --test tests/*.test.cjs
      - name: Audit v1 release blockers (informational; never deploy)
        run: node scripts/check-v1-readiness.cjs
      # Run a real Chrome session against the local development API.
      # Fail closed if Chrome is absent; this is a release gate, not a mock.
      - name: Real headless browser smoke test
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node --test tests/real-browser-smoke.cjs
