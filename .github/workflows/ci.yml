# Stage-0 CI: experimental branch and review PRs only; no deploy or repository secrets.
name: Dadyar stage-0 experimental CI
on:
  push:
    branches:
      - dadyar/mvp-sync-028
  pull_request:
    branches:
      - main
      - dadyar/mvp-sync-028
permissions:
  contents: read
jobs:
  verify-existing-frontend:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dadyar/mvp-sync-028') ||
      (github.event_name == 'pull_request' &&
       (github.base_ref == 'main' || github.base_ref == 'dadyar/mvp-sync-028'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check existing source syntax
        run: |
          node --check app.js
          node --check flows.js
          node --check export.js
          node --check api-validation.js
          node --check backend/validation.js
          node --check backend/rate-limit.js
          node --check backend/server.js
          node --check tests/real-browser-smoke.cjs
      - name: Run every committed contract test
        run: node --test tests/*.test.cjs
      - name: Audit v1 release blockers (informational; never deploy)
        run: node scripts/check-v1-readiness.cjs
      - name: Audit cheque amendment evidence gaps (research only)
        run: node scripts/audit-check-evidence.cjs
      - name: Assert unapproved v1 stays blocked (experimental only)
        run: |
          # Expected failure is a safeguard, not a claim of release readiness.
          set +e
          node scripts/check-v1-readiness.cjs --enforce > /tmp/dadyar-v1-audit.json
          code=$?
          set -e
          test "$code" -eq 1
          node -e 'const a=require("/tmp/dadyar-v1-audit.json"); if(a.status!=="NOT_READY" || a.uncheckedGates<1 || !Array.isArray(a.issues) || !a.issues.length) process.exit(1)'
      # Run a real Chrome session against the local development API.
      # Fail closed if Chrome is absent; this is a release gate, not a mock.
      - name: Real headless browser smoke test
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node --test tests/real-browser-smoke.cjs
