name: Dadyar isolated preview slice
on:
  push:
    branches:
      - dadyar/preview-review-slice-20261126
  pull_request:
    branches:
      - main
permissions:
  contents: read
  actions: read
concurrency:
  group: dadyar-preview-slice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    env:
      DADYAR_PREVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run offline boundary, 27-domain routing and restore-evidence tests
        run: node --test tests/dadyar-preview-offline-boundary.test.cjs tests/dadyar-preview-27-domain-routing.test.cjs tests/build-preview-review-artifact.test.cjs tests/preview-staging-evidence.test.cjs
      - name: Run narrow viewport Chromium smoke test
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node --test tests/dadyar-preview-mobile-chromium.test.cjs
      - name: Run real Chromium mobile device emulation and exact HTTP subpath test
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node --test tests/dadyar-preview-mobile-device-emulation.test.cjs
      - name: Build and verify public-only review artifact
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/build-preview-review-artifact.cjs "$RUNNER_TEMP/dadyar-preview-public"
      - name: Upload review artifact only; never deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dadyar-preview-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/dadyar-preview-public/
          if-no-files-found: error
          retention-days: 7
