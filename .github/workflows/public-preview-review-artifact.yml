name: Dadyar public-only preview review artifact

on:
  push:
    branches:
      - dadyar/ai-chat-private-20261101

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: dadyar-public-preview-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-public-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check preview source syntax
        run: |
          node --check app.js
          node --check flows.js
          node --check export.js
          node --check api-validation.js
          node --check backend/validation.js
          node --check backend/rate-limit.js
          node --check backend/server.js
          node --check scripts/verify-human-review-attestation.cjs
          node --check scripts/preview-release-preflight.cjs
          node --check scripts/strict-json.cjs
          node --check scripts/verify-restore-attestation-signatures.cjs
          node --check scripts/verify-restore-attestation-pinned.cjs
          node --check scripts/create-public-preview-integrity-manifest.cjs
          node --check scripts/verify-public-preview-artifact.cjs
          node --check scripts/wait-for-experimental-ci.cjs
          node --check tests/real-browser-smoke.cjs
      - name: Audit full Git history for known secret signatures
        run: node scripts/audit-git-history.cjs
      - name: Run every committed contract test before artifact creation
        run: |
          shopt -s nullglob
          tests=(tests/*.test.cjs)
          contracts=()
          for test_file in "${tests[@]}"; do
            [[ "$test_file" == tests/synthetic-cheque-chromium-e2e.test.cjs || "$test_file" == tests/dadyar-preview-mobile-chromium.test.cjs || "$test_file" == tests/dadyar-preview-mobile-device-emulation.test.cjs ]] || contracts+=("$test_file")
          done
          test "${#contracts[@]}" -gt 0
          node --test "${contracts[@]}"
      - name: Audit release blockers (informational; never deploy)
        run: node scripts/check-v1-readiness.cjs
      - name: Wait for exact-head stage-0 CI to finish before posture audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/wait-for-experimental-ci.cjs
      - name: Audit GitHub repository release posture (read-only; informational)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/audit-github-repository-posture.cjs
      - name: Audit cheque amendment evidence gaps (research only)
        run: node scripts/audit-check-evidence.cjs
      - name: Assert unapproved release remains blocked
        run: |
          set +e
          node scripts/check-v1-readiness.cjs --enforce > /tmp/dadyar-v1-audit.json
          code=$?
          set -e
          test "$code" -eq 1
          node -e 'const a=require("/tmp/dadyar-v1-audit.json"); if(a.status!=="NOT_READY" || a.uncheckedGates<1 || !Array.isArray(a.issues) || !a.issues.length) process.exit(1)'
      - name: Run real Chromium and mobile browser gates before artifact creation
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node --test tests/real-browser-smoke.cjs
          CHROME_BIN="$CHROME_BIN" node --test tests/check-intake-browser.cjs
          CHROME_BIN="$CHROME_BIN" node --test tests/synthetic-cheque-chromium-e2e.test.cjs
          CHROME_BIN="$CHROME_BIN" node --test tests/dadyar-preview-mobile-chromium.test.cjs
          CHROME_BIN="$CHROME_BIN" node --test tests/dadyar-preview-mobile-device-emulation.test.cjs
          node --test tests/dadyar-preview-27-domain-routing.test.cjs
      - name: Build isolated preview handoff (not deployment)
        env:
          DADYAR_PREVIEW_SOURCE_SHA: ${{ github.sha }}
          DADYAR_PREVIEW_WORKFLOW_SHA: ${{ github.sha }}
          DADYAR_PREVIEW_EVENT: push
          DADYAR_PREVIEW_BRANCH: dadyar/ai-chat-private-20261101
        run: |
          mkdir -p "$RUNNER_TEMP"
          node scripts/build-offline-preview-package.cjs "$RUNNER_TEMP/dadyar-preview-handoff"
      - name: Create public integrity manifest (not deployment)
        run: node scripts/create-public-preview-integrity-manifest.cjs "$RUNNER_TEMP/dadyar-preview-handoff"
      - name: Verify exact public ZIP before upload (not deployment)
        run: |
          set -euo pipefail
          command -v zip >/dev/null
          archive="$RUNNER_TEMP/dadyar-public-preview-review.zip"
          rm -f "$archive"
          (
            cd "$RUNNER_TEMP/dadyar-preview-handoff/public"
            zip -q -X "$archive" index.html INTEGRITY.json
          )
          node scripts/verify-public-preview-artifact.cjs "$archive" "$GITHUB_SHA"
      - name: Upload only public HTML and integrity manifest for review (not deployment)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dadyar-public-preview-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dadyar-preview-handoff/public/index.html
            ${{ runner.temp }}/dadyar-preview-handoff/public/INTEGRITY.json
          if-no-files-found: error
          retention-days: 7
