# Stage-0 CI: existing tests on experimental branch only; no deploy.
name: Dadyar stage-0 experimental CI
on:
  push:
    branches:
      - dadyar/mvp-sync-028
permissions:
  contents: read
jobs:
  verify-existing-frontend:
    if: github.ref == 'refs/heads/dadyar/mvp-sync-028'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check existing source syntax
        run: |
          node --check app.js
          node --check flows.js
          node --check export.js
          node --check backend/validation.js
          node --check backend/rate-limit.js
          node --check backend/server.js
      # Automatically execute all committed contract tests, including future additions.
      # This job never deploys and uses no repository secrets.
      - name: Run every committed contract test
        run: node --test tests/*.test.cjs
